version: "3"
services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile.docling-asr
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_MAX_SYNC_WAIT=600

  n8n:
    image: n8nio/n8n@sha256:cf11c96b0d0089bb24459bf97b445fd7008f41543b673cce4d955f7c0ed8752d
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data_1:/home/node/.n8n
    env_file:
      - .env
    depends_on:
      pgvector:
        condition: service_healthy
      docling:
        condition: service_started

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  n8n_data_1:
  pgvector_data:
